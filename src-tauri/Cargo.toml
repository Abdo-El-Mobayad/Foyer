[package]
name = "foyer"
version = "0.8.0"
description = "Foyer: a local viewing and launching layer for folders and repositories"
authors = ["Abdo El-Mobayad"]
license = "Apache-2.0"
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name unique so it doesn't conflict with the
# bin name (an issue on Windows, see rust-lang/cargo#8519).
name = "foyer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `protocol-asset` is what lets the webview stream a mounted file (images,
# PDFs, HTML pages, video) straight from disk through `asset://`.
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
walkdir = "2"
uuid = { version = "1", features = ["v4"] }
# Deleting a note or folder sends it to the Recycle Bin, never a permanent delete.
trash = "5"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
# Smaller binary, and the tree walk is the only hot path.
codegen-units = 1
lto = true
opt-level = "s"
strip = true
